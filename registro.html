<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo | Registro de Usuario</title>

    <!-- Link a Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Link a tu CSS personalizado -->
    <link rel="stylesheet" href="SonidoVivoEstilos.css">
</head>
<body>

    <!-- === HEADER === -->
    <header>
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow-sm">
            <div class="container">
                <!-- LOGO -->
                <a class="navbar-brand fw-bold fs-4 text-white" href="SonidoVivo.html">
                    Sonido <span class="color-azul">Vivo</span>
                </a>

                <!-- BOTÓN HAMBURGUESA -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- MENÚ -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link text-white" href="SonidoVivo.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="sobreNosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="login.html">Iniciar Sesión</a></li>
                        <li class="nav-item"><a class="nav-link text-white active" href="registro.html">Registrarme</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="carrito.html">Carrito</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- === CONTENIDO PRINCIPAL: REGISTRO === -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow p-4 border-0 rounded-3">
                    <h2 class="text-center fw-bold mb-4">Crear una Cuenta</h2>
                    
                    <form>
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="nombre" class="form-label fw-bold">Nombre</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="apellido" class="form-label fw-bold">Apellido</label>
                                <input type="text" class="form-control" id="apellido" placeholder="Tu apellido" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label fw-bold">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" placeholder="+56 9 1234 5678">
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="password" class="form-label fw-bold">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="confirmPassword" class="form-label fw-bold">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn text-white btn-lg" style="background-color: #005f7f;">
                                Registrarme
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-0 text-muted fs-6">¿Ya tienes cuenta? <a href="login.html" class="color-azul fw-bold">Inicia sesión aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- === FOOTER === -->
    <footer class="bg-dark text-white text-center p-4 mt-5">
        <p class="mb-1">© 2026 Sonido Vivo - Viña del Mar</p>
        <small class="text-secondary">Contacto: tienda.sonido.vivo@gmail.cl | Teléfono: +56 9 5555 5555</small>
    </footer>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
