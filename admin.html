<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo | Panel Administrativo</title>
    <!-- Link a Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="SonidoVivoEstilos.css">
</head>
<body class="bg-light">

    <!-- === HEADER ADMINISTRATIVO === -->
    <header>
        <nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold fs-4 text-white" href="admin.html">
                    Sonido Vivo | <span class="badge bg-dark">Admin Panel</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="adminNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link text-white active" href="admin.html">Mantenedor Productos</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="#seccion-usuarios">Mantenedor Usuarios</a></li>
                        <li class="nav-item"><a class="nav-link text-warning fw-bold ms-3" href="login.html">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- === CONTENIDO PRINCIPAL === -->
    <main class="container my-5">
        <h2 class="fw-bold mb-4">Gestión de Productos (Mantenedor)</h2>

        <div class="row g-4">
            <!-- Formulario para agregar producto -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 p-3">
                    <h4 class="fw-bold mb-3">Agregar Producto</h4>
                    <form id="form-producto" onsubmit="event.preventDefault(); agregarProducto();">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Producto</label>
                            <input type="text" class="form-control" id="prod-nombre" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Precio ($)</label>
                            <input type="number" class="form-control" id="prod-precio" required min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Categoría</label>
                            <select class="form-select" id="prod-categoria" required>
                                <option value="">Seleccione...</option>
                                <option value="Guitarras">Guitarras</option>
                                <option value="Teclados">Teclados</option>
                                <option value="Audio">Audio Profesional</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">URL Imagen</label>
                            <input type="url" class="form-control" id="prod-imagen" placeholder="https://..." required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                    </form>
                </div>
            </div>

            <!-- Tabla de productos listados -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-3">
                    <h4 class="fw-bold mb-3">Productos Registrados</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Imagen</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-admin-productos">
                                <!-- Filas dinámicas desde JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- === FOOTER === -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        <small>© 2026 Sonido Vivo - Panel de Administración</small>
    </footer>

    <!-- JS Bootstrap y JS Principal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
